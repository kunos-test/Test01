name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      # zip 하나만 올린 경우에도 그대로 빌드되도록 풀어준다
      - name: 소스 압축 풀기
        run: |
          if [ -f postit-source.zip ]; then
            unzip -o postit-source.zip
          fi
          ls -la

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 준비
        uses: android-actions/setup-android@v3

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 디버그 APK 빌드
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK 업로드 (Actions 아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: postit-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # 폰에서 바로 받을 수 있도록 Releases 에도 올린다
      - name: Releases 에 게시
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 최신 빌드
          body: 포스트잇 디버그 APK. 아래 app-debug.apk 를 눌러 받으세요.
          files: app/build/outputs/apk/debug/app-debug.apk
